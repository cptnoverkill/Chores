<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Chore Chart</title>
<!-- version 5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, clear enough for a seven-year-old to tick a box.
   IDEA: the chore chart stuck to the family fridge, each person a magnet.
   PICTURE: the board itself: one column per person, big tickable chores.
   COLOUR and TYPE: sunflower yellow field, ink black, tomato accent; Baloo 2 + Nunito.
   LAYOUT: title strip, people row, board; stacks to one column on phones. */
:root{color-scheme:light dark;
 --bg:light-dark(#ffd84d,#1c1a14);--paper:light-dark(#ffffff,#2a2720);--ink:light-dark(#1d1b16,#f6f1e4);
 --soft:light-dark(#6b6556,#b9b2a0);--line:light-dark(#ece6d6,#3d392f);--accent:#ff5a36;--ok:#1f9d6b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6vw,48px);font-weight:800}
h2{font-size:22px;font-weight:800}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:0 16px;font-weight:800;background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--ink);color:var(--bg)}
.ghost{background:transparent;box-shadow:none;text-decoration:underline;padding:0 8px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,14px)}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sub{color:var(--soft);font-weight:700;margin-top:6px}
:root:not([data-theme=dark]) .sub{color:#5a4a10}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .sub{color:var(--soft)}}
.status{font-size:13px;font-weight:700;opacity:.75}
.people{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--paper)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px "Baloo 2",sans-serif;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px;align-items:start}
.col{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.10);position:relative}
.col::before{content:"";position:absolute;top:-9px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 4px rgba(0,0,0,.2)}
.colhead{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.colhead .av{width:48px;height:48px;font-size:22px}
.stars{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}
.stars b{font:800 26px "Baloo 2",sans-serif;display:block;line-height:1}
.stars small{font-size:13px;color:var(--soft)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.meter i{display:block;height:100%;background:var(--c);transition:width .4s}
ul{list-style:none;margin:0;padding:0}
li.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tick{flex:none;width:44px;height:44px;border-radius:14px;padding:0;border:3px solid var(--c);background:transparent;box-shadow:none;display:grid;place-items:center}
.tick svg{width:24px;height:24px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done .tick{background:var(--c)}.done .tick svg{opacity:1}
.done .tname{text-decoration:line-through;color:var(--soft)}
.tbody{flex:1}
.tname{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--soft);white-space:nowrap}
.x{min-height:36px;padding:0 10px;font-size:13px;background:var(--line);box-shadow:none}
.x.sure{background:var(--accent);color:#fff}
.empty{color:var(--soft);padding:10px 0;font-weight:600}
.panel{background:var(--paper);border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 6px 0 rgba(0,0,0,.10)}
.panel h2{margin-bottom:12px}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800}
textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
input,select{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--paper)}
label.grow{flex:1 1 220px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;box-shadow:none;border:3px solid transparent}
.sw[aria-pressed=true]{border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hello{text-align:center;padding:40px 16px}
.hello p{max-width:46ch;margin:8px auto 0}
.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.meter i{transition:none}}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:-8px 0 22px}
.seg{display:inline-flex;background:var(--paper);border-radius:14px;padding:4px;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.seg button{box-shadow:none;min-height:40px;border-radius:10px;background:transparent}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.wknav{display:flex;align-items:center;gap:6px;font-weight:800}
.wknav button{width:44px;padding:0;font-size:20px}
.wknav span{min-width:10ch;text-align:center;white-space:nowrap}
.board.week{grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr))}
.wk{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,34px);gap:4px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wk.head{border-top:0;padding-top:0;font-size:13px;font-weight:800;color:var(--soft);text-align:center}
.wk.head b{display:block;font-size:13px;line-height:1.1}
.wk .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.wk .nm small{display:block;font-size:13px;font-weight:600;color:var(--soft)}
.cell{height:34px;min-height:34px;border-radius:9px;padding:0;display:grid;place-items:center;background:var(--line);box-shadow:none}
.cell svg{width:20px;height:20px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cell.on{background:var(--c)}
.cell.future{opacity:.35}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.wk.head .today{color:var(--ink)}
div.cell{cursor:default}
.wkhint{font-size:13px;color:var(--soft);margin-top:8px}
@media(max-width:600px){header{align-items:flex-start}.colhead .av{width:40px;height:40px}
 .wk{grid-template-columns:repeat(7,minmax(0,1fr))}.wk .nm{grid-column:1/-1}.wk.head .nm{display:none}.cell{height:38px}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div>
   <h1>Family chore chart</h1>
   <div class="sub" id="week"></div>
  </div>
  <div class="tools">
   <span class="status" id="status">Connecting…</span>
   <button id="editBtn" aria-pressed="false">Edit chart</button>
  </div>
 </header>
 <nav class="people" id="people" aria-label="Family members"></nav>
 <div class="bar" id="bar" hidden>
  <div class="seg" role="group" aria-label="View">
   <button type="button" data-tab="today" aria-pressed="true">Today</button>
   <button type="button" data-tab="week" aria-pressed="false">Week</button>
  </div>
  <div class="wknav" id="wknav" hidden>
   <button type="button" data-wk="-1" aria-label="Previous week">‹</button>
   <span id="wklabel"></span>
   <button type="button" data-wk="1" aria-label="Next week">›</button>
  </div>
 </div>
 <main id="board" class="board"></main>
 <section id="editor" hidden>
  <div class="panel">
   <h2>Add a chore</h2>
   <form class="row" id="taskForm">
    <label class="grow">Chore<input id="tTitle" required maxlength="80" placeholder="Feed the cat"></label>
    <label>For<select id="tWho" required></select></label>
    <label>Stars<select id="tPts"><option value="1">★ 1</option><option value="2">★ 2</option><option value="3">★ 3</option></select></label>
    <label>Repeats<select id="tRep"><option value="daily">Every day</option><option value="weekly">Every week</option><option value="once">Just once</option></select></label>
    <button class="primary" type="submit">Add chore</button>
   </form>
  </div>
  <div class="panel">
   <h2 id="pTitle">Add a family member</h2>
   <form class="row" id="personForm">
    <label class="grow">Name<input id="pName" required maxlength="30" placeholder="Maya"></label>
    <label>Colour<div class="swatches" id="swatches"></div></label>
    <button class="primary" type="submit" id="pSave">Add person</button>
    <button type="button" class="ghost" id="pCancel" hidden>Cancel</button>
   </form>
  </div>
  <div class="panel">
   <h2>Share across phones and tablets</h2>
   <p class="meta" id="linkNote" style="white-space:normal;margin:0 0 10px"></p>
   <div id="setup" hidden>
    <label>Firebase settings<textarea id="cfgText" rows="8" spellcheck="false" placeholder="Paste the whole firebaseConfig block from Firebase here"></textarea></label>
    <div class="tools" style="margin-top:10px"><button type="button" class="primary" id="cfgSave">Connect</button><span class="meta" id="cfgMsg" style="white-space:normal"></span></div>
   </div>
   <div class="tools" id="linkTools" hidden>
    <input id="famLink" readonly style="flex:1 1 280px">
    <button type="button" id="copyLink">Copy link</button>
    <button type="button" class="ghost" id="disconnect">Disconnect this device</button>
   </div>
  </div>
  <div class="panel">
   <h2>Tidy up</h2>
   <div class="tools">
    <button id="clearOnce">Remove finished one-time chores</button>
    <span class="meta">Daily chores reset each morning; weekly ones reset on Monday.</span>
   </div>
  </div>
 </section>
</div>
<script type="module">
{
const COLORS=["#ff5a36","#2f80ed","#1f9d6b","#9b51e0","#f2994a","#e0457b","#00a5b5","#6d5d4b"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const now=new Date(),today=key(now);
const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));const weekStart=key(mon);
const fmt=d=>d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
$("week").textContent=fmt(now)+" · week of "+mon.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let members=[],tasks=[],view="all",editing=false,editId=null,pickColor=COLORS[0],sureId=null,justTicked=null,mode="local",db=null,tab="today",wkOff=0;

/* ---------- storage: shared db when available, this device otherwise ---------- */
const LS="family-chores-v1";
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"{}");members=s.members||[];tasks=s.tasks||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({members,tasks}))}catch(e){}}
let fs=null,F=null,fam=null;
const ref=(coll,id)=>F.doc(fs,"families",fam,coll,id);
const api={
 async put(coll,obj){
  if(mode==="cloud"){const {id,...body}=obj;try{await F.setDoc(ref(coll,id),body)}catch(e){fail(e)}return}
  const arr=coll==="members"?members:tasks;const i=arr.findIndex(x=>x.id===obj.id);
  if(i<0)arr.push(obj);else arr[i]=obj;saveLocal();render();
 },
 async del(coll,id){
  if(mode==="cloud"){try{await F.deleteDoc(ref(coll,id))}catch(e){fail(e)}return}
  if(coll==="members")members=members.filter(x=>x.id!==id);else tasks=tasks.filter(x=>x.id!==id);
  saveLocal();render();
 }
};
function fail(e){console.error(e);$("status").textContent=e&&e.code==="permission-denied"?"Not allowed to save, check Firebase rules":"Couldn't save, check your connection";}

/* ---------- chore logic ---------- */
const log=t=>Array.isArray(t.log)?t.log.filter(x=>typeof x==="string"):[];
function isDone(t){const l=log(t);
 if(t.repeat==="daily")return l.includes(today);
 if(t.repeat==="weekly")return l.some(d=>d>=weekStart);
 return l.length>0}
function starsFor(m){return tasks.filter(t=>t.memberId===m.id).reduce((s,t)=>s+(+t.points||1)*log(t).filter(d=>d>=weekStart).length,0)}
function toggle(t){
 let l=log(t);
 if(isDone(t)){l=t.repeat==="daily"?l.filter(d=>d!==today):t.repeat==="weekly"?l.filter(d=>d<weekStart):[]}
 else{l=[...l,today].slice(-120);justTicked=t.id}
 api.put("tasks",{...t,log:l});
}
const sortT=(a,b)=>(isDone(a)-isDone(b))||String(a.createdAt).localeCompare(String(b.createdAt));
const repLabel={daily:"every day",weekly:"this week",once:"one time"};

/* ---------- rendering ---------- */
const check='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function avatar(m){return `<span class="av" style="background:${esc(m.color)}">${esc((m.name||"?").trim().charAt(0).toUpperCase())}</span>`}
function column(m){
 const mine=tasks.filter(t=>t.memberId===m.id).sort(sortT);
 const due=mine.filter(t=>!isDone(t)).length,done=mine.length-due;
 const pct=mine.length?Math.round(done/mine.length*100):0;
 const items=mine.map(t=>`<li class="task ${isDone(t)?"done":""}">
   <button class="tick ${justTicked===t.id?"pop":""}" data-tick="${esc(t.id)}" aria-pressed="${isDone(t)}" aria-label="${isDone(t)?"Undo":"Done"}: ${esc(t.title)}">${check}</button>
   <div class="tbody"><div class="tname">${esc(t.title)}</div><div class="meta">${"★".repeat(+t.points||1)} · ${repLabel[t.repeat]||"one time"}</div></div>
   ${editing?`<button class="x ${sureId===t.id?"sure":""}" data-deltask="${esc(t.id)}">${sureId===t.id?"Delete?":"Remove"}</button>`:""}
  </li>`).join("");
 return `<section class="col" style="--c:${esc(m.color)}">
  <div class="colhead">${avatar(m)}<h2>${esc(m.name)}</h2>
   <div class="stars"><b>★ ${starsFor(m)}</b><small>this week</small></div></div>
  <div class="meter" role="img" aria-label="${done} of ${mine.length} chores done"><i style="width:${pct}%"></i></div>
  <ul>${items||`<li class="empty">${editing?"No chores yet. Add one below.":"Nothing to do. Nice!"}</li>`}</ul>
  ${mine.length?`<div class="meta" style="padding-top:8px">${due?due+" left to do":"All done!"}</div>`:""}
  ${editing?`<div class="tools" style="margin-top:12px"><button class="x" data-editp="${esc(m.id)}">Edit ${esc(m.name)}</button>
   <button class="x ${sureId===m.id?"sure":""}" data-delp="${esc(m.id)}">${sureId===m.id?"Delete "+esc(m.name)+" and their chores?":"Remove person"}</button></div>`:""}
 </section>`;
}
/* ---------- week view ---------- */
const DAYS=["M","T","W","T","F","S","S"];
function weekKeys(off){const d0=new Date(mon);d0.setDate(mon.getDate()+off*7);
 return Array.from({length:7},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return {k:key(d),n:d.getDate(),d}})}
function weekCol(m,days){
 const first=days[0].k,last=days[6].k;
 const mine=tasks.filter(t=>t.memberId===m.id).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
 const st=mine.reduce((s,t)=>s+(+t.points||1)*log(t).filter(d=>d>=first&&d<=last).length,0);
 const head=`<div class="wk head"><div class="nm"></div>${days.map((x,i)=>`<div class="${x.k===today?"today":""}">${DAYS[i]}<b>${x.n}</b></div>`).join("")}</div>`;
 const rows=mine.map(t=>{const l=log(t);
  return `<div class="wk"><div class="nm">${esc(t.title)}<small>${"★".repeat(+t.points||1)} · ${repLabel[t.repeat]||"one time"}</small></div>${days.map((x,i)=>{
   const on=l.includes(x.k),fut=x.k>today,cls=`cell ${on?"on":""} ${fut?"future":""} ${x.k===today?"today":""}`;
   const lab=`${esc(t.title)}, ${x.d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}: ${on?"done":"not done"}`;
   return editing&&!fut?`<button type="button" class="${cls}" data-cell="${esc(t.id)}|${x.k}" aria-pressed="${on}" aria-label="${lab}">${on?check:""}</button>`
    :`<div class="${cls}" role="img" aria-label="${lab}">${on?check:""}</div>`}).join("")}</div>`}).join("");
 return `<section class="col" style="--c:${esc(m.color)}">
  <div class="colhead">${avatar(m)}<h2>${esc(m.name)}</h2><div class="stars"><b>★ ${st}</b><small>${wkOff===0?"this week":"that week"}</small></div></div>
  ${mine.length?head+rows:`<p class="empty">No chores yet.</p>`}
  ${editing&&mine.length?`<p class="wkhint">Tap a square to fix a missed or mistaken tick.</p>`:""}
 </section>`;
}
function wkLabel(days){if(wkOff===0)return "This week";if(wkOff===-1)return "Last week";
 const o={month:"short",day:"numeric"};return days[0].d.toLocaleDateString(undefined,o)+" – "+days[6].d.toLocaleDateString(undefined,o)}

function render(){
 if(view!=="all"&&!members.some(m=>m.id===view))view="all";
 $("people").innerHTML=members.length?`<button class="chip" data-view="all" aria-pressed="${view==="all"}"><span class="av" style="background:var(--ink);color:var(--bg)">★</span>Everyone</button>`+
  members.map(m=>`<button class="chip" data-view="${esc(m.id)}" aria-pressed="${view===m.id}">${avatar(m)}${esc(m.name)}</button>`).join(""):"";
 const shown=view==="all"?members:members.filter(m=>m.id===view);
 const days=weekKeys(wkOff);
 $("bar").hidden=!members.length;$("wknav").hidden=tab!=="week";$("wklabel").textContent=wkLabel(days);
 document.querySelector('[data-wk="1"]').disabled=wkOff>=0;
 document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
 $("board").classList.toggle("week",tab==="week"&&members.length>0);
 $("board").innerHTML=members.length?shown.map(m=>tab==="week"?weekCol(m,days):column(m)).join(""):
  `<section class="col hello" style="--c:var(--accent);grid-column:1/-1"><h2>Welcome to your chore chart</h2>
   <p>Start by adding each family member, then give them chores. Everyone ticks off their own, and stars add up through the week.</p>
   <p><button class="primary" id="startBtn">Add the first person</button></p></section>`;
 $("tWho").innerHTML=members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
 if(view!=="all")$("tWho").value=view;
 $("swatches").innerHTML=COLORS.map(c=>`<button type="button" class="sw" style="background:${c}" data-color="${c}" aria-label="Colour ${c}" aria-pressed="${c===pickColor}"></button>`).join("");
 $("editor").hidden=!editing;
 $("editBtn").textContent=editing?"Done editing":"Edit chart";
 $("editBtn").setAttribute("aria-pressed",editing);
 $("taskForm").querySelector("button").disabled=!members.length;
 justTicked=null;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.view){view=d.view;render();return}
 if(d.tab){tab=d.tab;wkOff=0;render();return}
 if(d.wk){wkOff=Math.min(0,wkOff+(+d.wk));render();return}
 if(d.cell){const [id,k]=d.cell.split("|");const t=tasks.find(x=>x.id===id);if(!t||k>today)return;
  const l=log(t);api.put("tasks",{...t,log:l.includes(k)?l.filter(x=>x!==k):[...l,k].sort().slice(-120)});return}
 if(d.tick){const t=tasks.find(x=>x.id===d.tick);if(t)toggle(t);return}
 if(d.color){pickColor=d.color;render();return}
 if(d.deltask){if(sureId===d.deltask){sureId=null;api.del("tasks",d.deltask)}else{sureId=d.deltask;render()}return}
 if(d.delp){if(sureId===d.delp){sureId=null;tasks.filter(t=>t.memberId===d.delp).forEach(t=>api.del("tasks",t.id));api.del("members",d.delp)}else{sureId=d.delp;render()}return}
 if(d.editp){const m=members.find(x=>x.id===d.editp);if(!m)return;editId=m.id;pickColor=m.color;$("pName").value=m.name;
  $("pTitle").textContent="Edit "+m.name;$("pSave").textContent="Save";$("pCancel").hidden=false;render();$("pName").focus();return}
 if(b.id==="startBtn"){editing=true;render();$("pName").focus();return}
 if(b.id==="editBtn"){editing=!editing;sureId=null;render();return}
 if(b.id==="pCancel"){resetPerson();render();return}
 if(b.id==="clearOnce"){tasks.filter(t=>t.repeat==="once"&&isDone(t)).forEach(t=>api.del("tasks",t.id));return}
});
function resetPerson(){editId=null;$("pName").value="";$("pTitle").textContent="Add a family member";$("pSave").textContent="Add person";$("pCancel").hidden=true;
 pickColor=COLORS[members.length%COLORS.length]}
$("personForm").addEventListener("submit",e=>{e.preventDefault();const name=$("pName").value.trim();if(!name)return;
 const old=members.find(m=>m.id===editId);
 api.put("members",old?{...old,name,color:pickColor}:{id:uid(),name,color:pickColor,createdAt:new Date().toISOString()});
 resetPerson();pickColor=COLORS[(members.length+1)%COLORS.length];render();});
$("taskForm").addEventListener("submit",e=>{e.preventDefault();const title=$("tTitle").value.trim(),memberId=$("tWho").value;if(!title||!memberId)return;
 api.put("tasks",{id:uid(),title,memberId,points:+$("tPts").value,repeat:$("tRep").value,log:[],createdAt:new Date().toISOString()});
 $("tTitle").value="";$("tTitle").focus();});

/* ---------- start ---------- */
const CFG_KEY=LS+"-firebase",FAM_KEY=LS+"-family",FIELDS=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];
function newCode(){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,b=>"abcdefghijkmnpqrstuvwxyz23456789"[b%32]).join("")}
const okCode=c=>/^[a-z0-9]{20,40}$/.test(c||"");
function pick(c){const o={};if(c&&typeof c==="object")for(const k of FIELDS)if(typeof c[k]==="string"&&c[k])o[k]=c[k];return o}
const okCfg=c=>!!(c&&c.apiKey&&c.apiKey.length>=20&&c.projectId&&c.appId);
function parseCfgText(t){const o={};for(const m of String(t).matchAll(/["']?(\w+)["']?\s*:\s*["']([^"'\n]+)["']/g))o[m[1]]=m[2].trim();return pick(o)}
const b64e=s=>btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>atob(s.replace(/-/g,"+").replace(/_/g,"/"));
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* read a family link: #f-<code>.<settings> */
const hm=location.hash.match(/^#f-([a-z0-9]{20,40})(?:\.([A-Za-z0-9_-]+))?$/);
if(hm){store(FAM_KEY,hm[1]);if(hm[2]){try{const c=pick(JSON.parse(b64d(hm[2])));if(okCfg(c))store(CFG_KEY,JSON.stringify(c))}catch(e){}}}
if(location.hash)history.replaceState(null,"",location.pathname+location.search);

function savedCfg(){try{const c=pick(JSON.parse(get(CFG_KEY)||"null"));return okCfg(c)?c:null}catch(e){return null}}
function showSetup(msg){
 mode="local";$("status").textContent="Saved on this device only";
 $("setup").hidden=false;$("linkTools").hidden=true;
 $("linkNote").textContent=msg||"Right now this chart lives only in this browser. To share it across the family's devices, paste your Firebase settings below. You only do this once; other devices join with a link.";
}
$("cfgSave").onclick=()=>{
 const c=parseCfgText($("cfgText").value);
 if(!okCfg(c)){$("cfgMsg").textContent="That doesn't look complete. Paste the whole block, from const firebaseConfig to the closing };";return}
 store(CFG_KEY,JSON.stringify(c));$("cfgText").value="";$("cfgMsg").textContent="";
 connect(c,{members:[...members],tasks:[...tasks]});
};
$("copyLink").onclick=async()=>{const i=$("famLink");try{await navigator.clipboard.writeText(i.value);$("copyLink").textContent="Copied!"}catch(e){i.select();$("copyLink").textContent="Press Ctrl/⌘+C"}
 setTimeout(()=>$("copyLink").textContent="Copy link",2000)};
$("disconnect").onclick=()=>{
 if($("disconnect").dataset.sure!=="1"){$("disconnect").dataset.sure="1";$("disconnect").textContent="Tap again to disconnect";return}
 store(CFG_KEY,null);store(FAM_KEY,null);location.reload();
};

let connected=false;
async function connect(cfg,carry){
 if(connected)return;connected=true;
 let code=get(FAM_KEY);if(!okCode(code)){code=newCode();store(FAM_KEY,code)}
 fam=code;mode="cloud";$("status").textContent="Loading…";
 $("setup").hidden=true;$("linkTools").hidden=false;
 $("famLink").value=location.origin+location.pathname+"#f-"+fam+"."+b64e(JSON.stringify(cfg));
 $("linkNote").textContent="Open this private link once on each family device and they'll all share this chart. Keep it within the family: anyone with the link can change chores.";
 try{
  const v="10.12.2";
  const A=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  F=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  fs=F.getFirestore(A.initializeApp(cfg));
 }catch(e){console.error(e);connected=false;showSetup("Couldn't load Firebase. Check your internet connection and try Connect again.");return}
 const got={members:false,tasks:false};
 const timer=setTimeout(()=>{$("status").textContent="Can't reach the cloud yet"},10000);
 const sub=coll=>F.onSnapshot(F.collection(fs,"families",fam,coll),{includeMetadataChanges:true},snap=>{
   const list=snap.docs.map(d=>({id:d.id,...d.data()}));
   if(!snap.metadata.fromCache&&!got[coll]&&snap.empty&&carry&&carry[coll].length){
    /* first connection: copy what was on this device up to the cloud */
    carry[coll].forEach(x=>api.put(coll,x));carry[coll]=[];
   }
   if(coll==="members")members=list.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));else tasks=list;
   if(!snap.metadata.fromCache){got[coll]=true;if(got.members&&got.tasks){clearTimeout(timer);$("status").textContent="Synced for the family"}}
   render();
  },err=>{clearTimeout(timer);console.error(err);
   $("status").textContent=err.code==="permission-denied"?`Blocked (code ${fam.length} chars, project ${cfg.projectId})`:"Sync stopped, reload the page"});
 sub("members");sub("tasks");
}

loadLocal();render();
const cfg0=savedCfg();
if(cfg0)connect(cfg0);else showSetup();
}
</script>
</body>
</html>
